name: CI-CD

on:
  push:
    branches: [ "main", "develop", "features/*" ]
  pull_request:
    branches: [ "main", "develop", "features/*" ]
    
jobs:
  ci:
    name: Test with Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t databricks-ml:ci .

      - name: Run tests inside container
        run: |
          docker run databricks-ml:ci

  cd:
    name: Build & Push Docker Image
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/databricks-ml:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/databricks-ml:latest
